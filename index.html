<!DOCTYPE html>
<html>
<head>
    <title>Secure Proxy</title>
    <style>
        body { margin: 0; padding: 0; }
        iframe { width: 100%; height: 100vh; border: none; }
    </style>
</head>
<body>
    <iframe id="proxy" src=""></iframe>
    <script>
        // Get the URL from the query string (e.g., ?url=https://google.com)
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = urlParams.get('url');

        if (targetUrl) {
            // Encode the URL for safety
            const encodedUrl = encodeURIComponent(targetUrl);
            // Use a reliable public proxy API (like `corsproxy.io` or `allorigins`)
            // Note: These are free, public proxies. For higher security, host your own.
            document.getElementById('proxy').src = `https://corsproxy.io/?${encodedUrl}`;
        } else {
            document.body.innerHTML = '<h1 style="text-align:center; margin-top:50%;">Enter URL: <input type="text" id="input" placeholder="https://example.com" /><button onclick="load()">Go</button></h1>';
        }

        function load() {
            const input = document.getElementById('input').value;
            if (input) {
                window.location.href = `?url=${encodeURIComponent(input)}`;
            }
        }
    </script>
</body>
</html>
